<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Dashboard')}"></head>
<body class="d-flex flex-column min-vh-100 bg-light">

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container animate-fade-in">
    <!-- Stats Row -->
    <div class="row mb-4">
        <div class="col-md-6 mb-3">
            <div class="glass-card p-4 text-center">
                <h5 class="text-muted mb-2">Total URLs</h5>
                <div class="stat-value" th:text="${totalUrls}">0</div>
            </div>
        </div>
        <div class="col-md-6 mb-3">
            <div class="glass-card p-4 text-center">
                <h5 class="text-muted mb-2">Total Clicks</h5>
                <div class="stat-value" th:text="${totalClicks}">0</div>
            </div>
        </div>
    </div>

    <!-- Create URL Section -->
    <div class="glass-card p-4 mb-5">
        <h4 class="mb-4"><i class="bi bi-magic text-primary"></i> Create New Short URL</h4>
        <form id="shortenForm">
            <div class="row g-3 align-items-center">
                <div class="col-md-6">
                    <input type="url" class="form-control form-control-lg" id="originalUrl" placeholder="Enter long URL (https://...)" required>
                </div>
                <div class="col-md-3">
                    <input type="text" class="form-control form-control-lg" id="customAlias" placeholder="Custom Alias (optional)">
                </div>
                <div class="col-md-3">
                    <button type="submit" class="btn btn-primary-custom btn-lg w-100" id="shortenBtn">
                        Shorten
                    </button>
                </div>
            </div>
            <div id="formFeedback" class="mt-2 text-danger"></div>
        </form>
    </div>

    <!-- URLs Table Section -->
    <div class="glass-card p-4">
        <h4 class="mb-4"><i class="bi bi-list-ul text-primary"></i> Your URLs</h4>
        <div class="table-responsive">
            <table class="table table-hover table-custom mb-0">
                <thead>
                    <tr>
                        <th>Short Code</th>
                        <th>Original URL</th>
                        <th>Created</th>
                        <th>Clicks</th>
                        <th>Status</th>
                        <th class="text-end">Actions</th>
                    </tr>
                </thead>
                <tbody id="urlTableBody">
                    <tr th:each="url : ${urls}" th:id="'url-row-' + ${url.id}">
                        <td>
                            <a th:href="@{'/' + ${url.shortCode}}" target="_blank" class="fw-bold text-decoration-none" th:text="${url.shortCode}"></a>
                            <button class="btn btn-sm btn-link text-muted copy-btn" th:data-url="@{${@environment.getProperty('app.base-url') ?: 'http://localhost:8080'} + '/' + ${url.shortCode}}" title="Copy to clipboard">
                                <i class="bi bi-clipboard"></i>
                            </button>
                        </td>
                        <td class="text-truncate" style="max-width: 250px;" th:text="${url.originalUrl}"></td>
                        <td th:text="${#temporals.format(url.createdAt, 'dd MMM yyyy')}"></td>
                        <td>
                            <span class="badge bg-primary rounded-pill px-3 py-2" th:text="${url.clickCount}"></span>
                        </td>
                        <td>
                            <span class="badge" th:classappend="${url.active} ? 'bg-success' : 'bg-danger'" th:text="${url.active ? 'Active' : 'Inactive'}"></span>
                        </td>
                        <td class="text-end">
                            <a th:href="@{'/analytics/' + ${url.id}}" class="btn btn-sm btn-outline-info rounded-pill">
                                <i class="bi bi-graph-up"></i>
                            </a>
                            <button class="btn btn-sm btn-outline-warning rounded-pill toggle-btn" th:data-id="${url.id}" th:title="${url.active ? 'Disable' : 'Enable'}">
                                <i class="bi" th:classappend="${url.active ? 'bi-pause-circle' : 'bi-play-circle'}"></i>
                            </button>
                            <button class="btn btn-sm btn-outline-danger rounded-pill delete-btn" th:data-id="${url.id}">
                                <i class="bi bi-trash"></i>
                            </button>
                        </td>
                    </tr>
                    <tr th:if="${urls.empty}">
                        <td colspan="6" class="text-center py-4 text-muted">You haven't created any URLs yet.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>

<!-- Axios for API calls -->
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<!-- Include CSRF token if needed, but we used standard session auth -->
<script th:inline="javascript">
    document.addEventListener("DOMContentLoaded", function() {
        
        // Handle URL shortening
        const shortenForm = document.getElementById('shortenForm');
        const feedback = document.getElementById('formFeedback');
        
        shortenForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = document.getElementById('shortenBtn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>';
            btn.disabled = true;
            
            const payload = {
                originalUrl: document.getElementById('originalUrl').value,
                customAlias: document.getElementById('customAlias').value
            };
            
            axios.post('/api/urls', payload)
                .then(response => {
                    window.location.reload(); // Quick refresh to show new URL
                })
                .catch(error => {
                    if (error.response && error.response.data) {
                        feedback.innerText = error.response.data.error || 'Failed to shorten URL';
                    } else {
                        feedback.innerText = 'An unexpected error occurred';
                    }
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                });
        });

        // Handle Copy to Clipboard
        document.querySelectorAll('.copy-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const url = this.getAttribute('data-url');
                navigator.clipboard.writeText(url).then(() => {
                    const icon = this.querySelector('i');
                    icon.classList.remove('bi-clipboard');
                    icon.classList.add('bi-check-lg', 'text-success');
                    setTimeout(() => {
                        icon.classList.remove('bi-check-lg', 'text-success');
                        icon.classList.add('bi-clipboard');
                    }, 2000);
                });
            });
        });

        // Handle Toggle
        document.querySelectorAll('.toggle-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const id = this.getAttribute('data-id');
                axios.put(`/api/urls/${id}/toggle`)
                    .then(() => window.location.reload())
                    .catch(err => alert('Failed to toggle URL status'));
            });
        });

        // Handle Delete
        document.querySelectorAll('.delete-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                if(confirm('Are you sure you want to delete this URL? This action cannot be undone.')) {
                    const id = this.getAttribute('data-id');
                    axios.delete(`/api/urls/${id}`)
                        .then(() => window.location.reload())
                        .catch(err => alert('Failed to delete URL'));
                }
            });
        });
    });
</script>
</body>
</html>
